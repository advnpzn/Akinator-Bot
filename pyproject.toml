[project]
name = "akinator-bot"
version = "3.0.0"
description = "Modern concurrent Telegram Akinator bot (akipy + TRAWL + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akipy==1.7.0",
    "aiosqlite>=0.22.1,<0.23",
    "python-dotenv>=1.2.4,<2",
    "python-telegram-bot[rate-limiter]>=22.8,<23",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
akinator-bot = "akinator_bot:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.4.0,<2", "ruff>=0.16.10,<0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
