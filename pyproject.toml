[project]
name = "akinator-bot"
version = "2.0.0"
description = "Modern concurrent Telegram Akinator bot (akipy + TRAWL + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akipy==1.6.0",
    "aiosqlite>=0.21.0",
    "python-dotenv>=1.1.0",
    "python-telegram-bot[job-queue]>=22.3",
    "httpx>=0.28.1",
]

[project.scripts]
akinator-bot = "akinator_bot:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
