# Self-hosted Akinator Telegram bot.
# Uses host TRAWL on the shared Docker network trawl_default.
#
#   docker compose up -d --build
#   docker compose logs -f bot

services:
  bot:
    build: .
    image: akinator-bot:latest
    container_name: akinator-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_PATH: /app/data/akinator.db
      ASSETS_DIR: /app/assets/aki_pics
      # Reach existing TRAWL container by service name (not 127.0.0.1)
      AKIPY_SOLVER_URL: http://trawl:8191
      SOLVER_URL: http://trawl:8191
      SOLVER_TIMEOUT_MS: ${SOLVER_TIMEOUT_MS:-90000}
    volumes:
      - akinator-data:/app/data
    networks:
      - default
      - trawl_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  akinator-data:
    name: akinator-data

networks:
  trawl_default:
    external: true
