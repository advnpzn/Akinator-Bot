# Self-hosted Akinator Telegram bot.
#
# Uses host networking so outbound Akinator traffic shares the host public IP
# (Docker bridge IPs are often blocked by Cloudflare). TRAWL on the host is
# reached at 127.0.0.1:8193.
#
#   docker compose up -d --build
#   docker compose logs -f bot

services:
  bot:
    build: .
    image: akinator-bot:latest
    container_name: akinator-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_PATH: /app/data/akinator.db
      ASSETS_DIR: /app/assets/aki_pics
      # Host TRAWL bind (see ~/Deployments/trawl)
      AKIPY_SOLVER_URL: http://127.0.0.1:8193
      SOLVER_URL: http://127.0.0.1:8193
      SOLVER_TIMEOUT_MS: ${SOLVER_TIMEOUT_MS:-90000}
    volumes:
      - akinator-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  akinator-data:
    name: akinator-data
