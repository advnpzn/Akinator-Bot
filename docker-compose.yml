services:
  bot:
    build: .
    image: akinator-bot:3.0.0
    restart: unless-stopped
    init: true
    env_file: ${BOT_ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /app/data/akinator.db
      ASSETS_DIR: /app/assets/aki_pics
    volumes:
      - akinator-data:/app/data
    cpus: ${BOT_CPUS:-1.0}
    mem_limit: ${BOT_MEMORY:-512m}
    pids_limit: 64
    stop_grace_period: 150s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  akinator-data:
    # Preserve the volume used by the previous deployment.
    name: akinator-data
